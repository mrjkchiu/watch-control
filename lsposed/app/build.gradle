plugins {
    id 'com.android.application'
}

android {
    namespace 'com.watchctl.hook'
    compileSdk 34
    archivesBaseName = 'watchctl-module'

    signingConfigs {
        watchctl {
            storeFile file('/workspace/watch-control/keys/watchctl.keystore.p12')
            storePassword 'watchctl'
            keyAlias 'watchctl'
            keyPassword 'watchctl'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId 'com.watchctl.hook'
        minSdk 29        // Android 10+；RECEIVER_NOT_EXPORTED 需 33（用兼容常量，见注）
        targetSdk 34
        versionCode 5
        versionName '0.1.4'
    }
    buildTypes {
        debug { signingConfig signingConfigs.watchctl }
        release { minifyEnabled false; signingConfig signingConfigs.watchctl }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API 只参与编译，不打包（由 LSPosed 框架在运行时提供）。
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
