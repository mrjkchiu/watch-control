plugins {
    id 'com.android.application'
}

// 单服务 APK：只含一个 AccessibilityService，用来在 WorkBuddy 的 .ShareAddToChat
// 把文本预填进会话输入框后，自动点一次「发送」按钮，凑成「手表 → 全无人值守」闭环。
//
// 无界面、无后台弹窗、不读任何隐私；仅监听 com.tencent.workbuddy.app 的窗口，
// 且仅在 relay 通过广播「武装(armed)」后的时间窗内才点击，平时不动，
// 避免误伤用户手动打开的分享页。
//
// AGP / SDK 版本按你本机 Android SDK 调整（下面是最低可编译组合，已测可出 debug APK）。

android {
    namespace 'com.watchctl.wbautosend'
    compileSdk 34

    defaultConfig {
        applicationId 'com.watchctl.wbautosend'
        minSdk 24          // AccessibilityService 自 API 14 即稳定，24 仅因 RECEIVER_NOT_EXPORTED 常量
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 framework API，无第三方依赖。
}
